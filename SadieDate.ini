; ============================================================
;  SadieDate configuration  (date-only shim)
; ------------------------------------------------------------
;  Keep this file in the SAME folder as SadieDate.exe,
;  SadieDate64.exe and the SadieHook*.dll files.
;  Then just double-click SadieDate.exe. No administrator needed.
; ============================================================

[SadieDate]

; The date SADiE (and its plugins) should see. Use YYYY-MM-DD.
; You may also pin a time:  YYYY-MM-DD HH:MM:SS  (24-hour).
; If you give only a date, the current time-of-day is kept.
; Pick a date comfortably BEFORE the build's / plugins' expiry.
TargetDate=2008-01-01

; Full path to the program to launch. No quotes here.
; (SadieDate auto-detects whether it is 32- or 64-bit.)
Program=C:\Program Files\SADiE\SADiE.exe

; Optional. Working directory. Blank = the program's own folder.
WorkingDir=

; Optional. Extra command-line arguments to pass to the program.
Args=

; ------------------------------------------------------------
; Notes:
;  * The REAL Windows clock is never changed, so files SADiE writes
;    keep today's correct date, and drive mounts / network logins
;    are unaffected.
;  * The faked date advances at the normal rate (constant offset),
;    so audio timing is untouched. Verify with ShowDate.exe first:
;        SadieDate.exe "2008-01-01" ShowDate.exe
;    ShowDate should print 2008 while your taskbar clock still shows
;    today. Then do an A/B null test through SADiE before trusting it.
; ------------------------------------------------------------
