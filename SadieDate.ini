; ============================================================
;  SadieDate configuration  (date-only shim)
; ------------------------------------------------------------
;  Keep this file in the SAME folder as SadieDate.exe,
;  SadieDate64.exe and the SadieHook*.dll files.
;  Then just double-click SadieDate.exe. No administrator needed.
; ============================================================

[SadieDate]

; The date the program (and its plugins) should see. Use YYYY-MM-DD.
; You may also pin a time:  YYYY-MM-DD HH:MM:SS  (24-hour).
; Used as the default for any [Programs] entry that doesn't set its own.
TargetDate=2008-01-01

; -- If you use only ONE SADiE, set its full path here and ignore the
;    [Programs] section below. No quotes needed.
Program=C:\Program Files\SADiE\SADiE.exe

; Optional. Working directory. Blank = the program's own folder.
WorkingDir=

; Optional. Extra command-line arguments to pass to the program.
Args=

; Optional. Which date functions the shim intercepts. Use this if the program
; starts but a HARDWARE DRIVER complains (e.g. SADiE's "OpusSys driver is NOT
; PRESENT") -- that can happen if the driver's I/O path reads one of the
; lower-level time functions. Narrow the scope until the driver is happy AND
; the date check is still fooled:
;   full     = all time functions (default; most thorough date spoof)
;   safe     = skip NtQuerySystemTime (common driver-timing call)
;   minimal  = only GetLocalTime + GetSystemTime (what most date checks use)
;   calendar = only GetLocalTime
; Try "minimal" first if you see the driver error, then "safe", then "full".
HookLevel=full

; Optional. HookDynamic=0 turns off the most invasive part (hooking
; GetProcAddress + LoadLibrary across the whole process). Try 0 if the program
; CRASHES under the shim. Downside: plugins loaded later, or date calls resolved
; dynamically, may not be covered -- but it's a good test to see if these hooks
; are what destabilises the program.
HookDynamic=0

; Optional. HookScope=exe patches ONLY the target program's own imports and
; nothing else (no system DLLs, no plugins, no GetProcAddress/LoadLibrary) --
; the gentlest possible footprint. Use this if the program CRASHES under the
; shim even with HookDynamic=0. It still fools a date check the program's own
; .exe makes directly (the common case). HookScope=all (default) is broader.
HookScope=exe

; Optional. Set Debug=1 to write a diagnostic log (SadieDate-log.txt, next to
; SadieDate.exe) and show each injection step. Use this if the date is NOT being
; changed: run  SadieDate.exe "2008-01-01" ShowDate.exe  then read the log --
; it says whether the shim DLL loaded and how many functions it hooked.
Debug=0


; ============================================================
;  Several SADiE versions? List them here instead.
; ------------------------------------------------------------
;  One line per program, numbered 1, 2, 3, ...   Format:
;
;      N = Label | Full path to the .exe | TargetDate(optional)
;
;  * Label        - any name you like (shown in the menu).
;  * Full path    - where that version's .exe actually lives.
;  * TargetDate   - OPTIONAL. Leave it off to use the TargetDate above.
;                   Use it when a version/plugin expires on a different date.
;
;  When more than one is listed, SadieDate shows a pick-list. You can also
;  choose directly:
;      SadieDate.exe 2            (by number)
;      SadieDate.exe "SADiE 6"    (by name)
;  so you can make one desktop shortcut per version if you like.
;
;  If this section is empty, the single Program= line above is used.
;  (Remove the leading ; to activate the examples, and edit the paths.)
; ============================================================

[Programs]
; 1 = SADiE 5   | C:\Program Files\SADiE 5\Sadie5.exe            | 2008-01-01
; 2 = SADiE 6   | D:\Audio\SADiE 6\Sadie6.exe                    | 2010-06-01
; 3 = LRX2      | C:\Program Files (x86)\SADiE\LRX2.exe
; 4 = SADiE H64 | C:\Program Files\SADiE\SADiE H64\SadieH64.exe  | 2012-03-01
