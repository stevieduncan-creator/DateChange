; ============================================================
;  SadieDate configuration
; ------------------------------------------------------------
;  Keep this file in the SAME folder as SadieDate.exe.
;  Then just double-click SadieDate.exe (Run as administrator).
; ============================================================

[SadieDate]

; ---- Required -------------------------------------------------

; The date SADiE should see. Use YYYY-MM-DD.
; You may also pin a time:  YYYY-MM-DD HH:MM:SS  (24-hour).
; If you give only a date, the current time-of-day is kept.
; Pick any date comfortably BEFORE the build's expiry. Tip: pick a
; date you never used for real projects (e.g. 2008-01-01) so the
; automatic date-correction below can tell session files apart.
TargetDate=2008-01-01

; Full path to the program to launch. No quotes needed here.
Program=C:\Program Files\SADiE\SADiE.exe


; ---- Keeping your real file dates -----------------------------
; While SADiE runs, the whole PC clock reads the back-date, so files
; SADiE writes are stamped with that back-date. There are two ways to
; end up with the CORRECT real date. Use whichever suits your build.

; (A) Automatic correction (default, always works).
;     After SADiE closes, SadieDate corrects the dates of files that
;     were written during the session, in the folders you list here.
;     This only changes the file's date metadata, never its contents,
;     and never its audio samples. List one or more folders separated
;     by semicolons. Leave blank to turn correction off.
WatchDirs=D:\SADiE Projects;D:\Audio Captures

; Set to 0 to disable the automatic date correction above.
FixFileDates=1

; (B) Early restore (only if your build checks the date at STARTUP).
;     If > 0, SadieDate restores the real clock this many seconds
;     after launch, while SADiE keeps running. Anything you save then
;     gets the correct real date automatically, with no correction
;     step needed. Leave at 0 if SADiE re-checks the date while open
;     (it would complain when the clock jumps forward). Try 30 first.
RestoreAfterSeconds=0


; ---- Optional -------------------------------------------------

; Working directory for the program. Blank = the program's own folder.
WorkingDir=

; Extra command-line arguments to pass to the program.
Args=

; Set to 1 to keep this window open after the program closes.
PauseOnExit=0
